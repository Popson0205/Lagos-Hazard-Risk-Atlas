version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: risk_atlas
      POSTGRES_USER: risk_atlas
      POSTGRES_PASSWORD: risk_atlas
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    env_file: .env
    # TiTiler is embedded in this service (app/tiler.py, mounted at /titiler).
    depends_on:
      - postgis
    volumes:
      - ./backend/app:/app/app
      - cog_cache:/data/cogs
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    environment:
      - VITE_API_BASE_URL=/api/v1

  nginx:
    image: nginx:alpine
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgis_data:
  cog_cache:
