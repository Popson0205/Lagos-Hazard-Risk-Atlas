<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagos State Climate Hazard Risk Atlas</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>Lagos Risk Atlas</h1>

        <section>
          <label for="hazard-select">Hazard theme</label>
          <select id="hazard-select"></select>
        </section>

        <section>
          <label for="scenario-select">Scenario / period</label>
          <select id="scenario-select"></select>
        </section>

        <section id="layer-list-section">
          <h2>Layers</h2>
          <ul id="layer-list"></ul>
        </section>

        <section id="legend-section">
          <h2>Legend</h2>
          <div id="legend"></div>
        </section>

        <section id="identify-section">
          <h2>Identify</h2>
          <div id="identify-result">Click the map to inspect a location.</div>
        </section>

        <section>
          <label for="search-input">Search location / LGA</label>
          <input id="search-input" type="text" placeholder="e.g. Ikeja" />
          <ul id="search-results"></ul>
        </section>
      </aside>
      <main id="map"></main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
