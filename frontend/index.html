<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lagos State Climate Hazard Risk Atlas</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1>Lagos Risk Atlas</h1>

        <!-- Workflow: 1 choose hazard -> 2 switch on a layer -> 3 set the area
             -> 4 (live layers) pick a satellite scene -> 5 run analysis. -->

        <section id="step-hazard">
          <h2><span class="step-num">1</span>Hazard &amp; scenario</h2>
          <label for="hazard-select">Hazard theme</label>
          <select id="hazard-select"></select>
          <label for="scenario-select">Scenario / period</label>
          <select id="scenario-select"></select>
        </section>

        <section id="layer-list-section">
          <h2><span class="step-num">2</span>Layers</h2>
          <ul id="layer-list"></ul>
        </section>

        <section id="aoi-section">
          <h2><span class="step-num">3</span>Area of interest</h2>
          <label for="search-input">Search a place, LGA or ward</label>
          <input id="search-input" type="text" placeholder="e.g. Ikeja" />
          <ul id="search-results"></ul>

          <div id="boundaries-section">
            <label for="boundary-state-select">State</label>
            <select id="boundary-state-select" disabled>
              <option value="lagos">Lagos</option>
            </select>
            <label for="boundary-lga-select">Local Government Area</label>
            <select id="boundary-lga-select">
              <option value="">Loading LGAs…</option>
            </select>
            <label for="boundary-ward-select">Ward</label>
            <select id="boundary-ward-select" disabled>
              <option value="">Select an LGA first…</option>
            </select>
          </div>

          <div class="or-divider"><span>or</span></div>
          <div class="button-row">
            <button id="aoi-draw-btn" type="button">Draw your own area</button>
            <button id="aoi-finish-btn" type="button" hidden>Finish drawing</button>
            <button id="aoi-cancel-btn" type="button" hidden>Cancel</button>
          </div>

          <div id="aoi-summary" class="hint">No area selected. Pick a ward, or draw your own.</div>
          <div class="button-row">
            <button id="aoi-clear-btn" type="button" hidden>Clear area</button>
          </div>
        </section>

        <section id="scene-search-section" class="locked">
          <h2><span class="step-num">4</span>Imagery scene</h2>
          <div class="scene-date-row">
            <input id="scene-date-start" type="date" aria-label="Search from date" />
            <input id="scene-date-end" type="date" aria-label="Search to date" />
          </div>
          <label for="scene-max-cloud">Max cloud cover (%)</label>
          <input id="scene-max-cloud" type="number" value="30" min="0" max="100" />
          <div class="button-row">
            <button id="search-scenes-btn" type="button" disabled>Search scenes</button>
          </div>
          <div id="scene-search-status" class="hint"></div>
          <ul id="scene-list"></ul>
        </section>

        <section id="analysis-section">
          <h2><span class="step-num">5</span>Analyse</h2>
          <div class="button-row">
            <button id="aoi-run-analysis-btn" type="button" disabled>Run analysis on active layer</button>
          </div>
          <div id="analysis-hint" class="hint">Needs an active layer and an area of interest.</div>
          <div id="aoi-result"></div>
        </section>

        <section id="identify-section">
          <h2>Identify</h2>
          <div id="identify-result">Click the map to inspect a location.</div>
        </section>
      </aside>
      <main id="map"></main>
    </div>

    <div id="analysis-modal-overlay" class="modal-overlay" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="analysis-modal-title">
        <button id="analysis-modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
        <div id="analysis-modal-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
