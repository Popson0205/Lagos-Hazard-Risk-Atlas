# Render Blueprint for the combined single-service deploy — one Web Service
# runs the FastAPI backend AND serves the built frontend from the same
# container/port (see the root Dockerfile and app/main.py's StaticFiles
# mount). Use "New > Blueprint" in the Render dashboard, pointed at this repo.
#
# Deploying manually instead? In the service's Settings > Build & Deploy, set:
#   Dockerfile Path: Dockerfile
#   Docker Build Context Directory: .
# (the repo root — this is the combined Dockerfile, not backend/Dockerfile
# or frontend/Dockerfile, which are for the separate-services / local
# docker-compose setup instead.)
#
# After the first deploy, enable PostGIS on the managed database and load
# the schema (Render's Postgres supports the extension, but it isn't on by
# default):
#   psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS postgis;"
#   psql "$DATABASE_URL" -f backend/app/db_init.sql
#
# TiTiler (raster tile server) isn't included below — point TITILER_BASE_URL
# at an existing TiTiler deployment, or add one as its own
# `runtime: image` service using `ghcr.io/developmentseed/titiler:latest`.

databases:
  - name: lagos-risk-atlas-db
    plan: starter
    postgresMajorVersion: 16

services:
  - type: web
    name: lagos-risk-atlas
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lagos-risk-atlas-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*" # same-origin deploy — frontend and API share this service's URL, so CORS mostly doesn't matter here
      - key: STAC_API_URL
        value: https://planetarycomputer.microsoft.com/api/stac/v1
      - key: TITILER_BASE_URL
        value: http://localhost:8001 # replace with a real TiTiler URL — see note above
